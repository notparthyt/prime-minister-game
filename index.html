<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prime Minister: Rule Valoria</title>
<meta name="description" content="A 2D strategy game: lead an imaginary nation through war, diplomacy and elections.">
<link rel="stylesheet" href="style.css"></head><body>
<header>
<h1>Prime Minister · Valoria</h1>
<div class="st"><b id="sGold">0</b><span>Treasury</span></div>
<div class="st"><b id="sApp">0</b><span>Approval</span></div>
<div class="st"><b id="sMil">0</b><span>Military</span></div>
<div class="st"><b id="sEco">0</b><span>Economy</span></div>
<div class="st"><b id="sLand">0</b><span>Land held</span></div>
<div class="st"><b id="sTurn">0</b><span>Date</span></div>
</header>
<main>
<section class="map">
<canvas id="cv" width="720" height="440" aria-label="World map"></canvas>
<div class="leg" id="leg"></div>
<div id="log" aria-live="polite"></div>
</section>
<aside>
<div class="box"><h3>Cabinet</h3>
<div class="small">Actions left this quarter: <b id="ap">3</b></div>
<div style="margin:6px 0">Tax: <span id="taxb"></span></div>
<button id="bEco">Invest in industry (100)</button>
<button id="bMil">Recruit troops (80)</button>
<button id="bWel">Fund welfare (90)</button>
<button class="pri" id="bEnd" style="width:100%;margin-top:8px">End quarter</button></div>
<div class="box" id="side"></div>
</aside>
</main>
<div id="modal"><div id="mb"></div></div>
<script src="game.js"></script></body></html>
